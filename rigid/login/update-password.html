<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | RiGiD</title>

    <link rel="icon" type="image/png" href="../assets/rigid-logo.png">
    <!-- =====================================================
         FONTS
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">


    <!-- =====================================================
         TAILWIND
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- =====================================================
         GLOBAL CSS
         ===================================================== -->

    <link rel="stylesheet" href="../styles.css">


    <!-- =====================================================
         LOGIN CSS
         ===================================================== -->

    <link rel="stylesheet" href="login.css">


    <!-- =====================================================
         THEME
         ===================================================== -->

    <script>

        if (
            localStorage.getItem("logbook-theme") === "dark" ||
            (
                !localStorage.getItem("logbook-theme") &&
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches
            )
        ) {

            document.documentElement.classList.add(
                "dark"
            );

        }

    </script>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

</head>


<body class="min-h-screen flex flex-col login-bg">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header-bar">

        <div class="w-full px-4 sm:px-6 py-4 flex items-center justify-between">

            <!-- BRAND -->

            <div class="flex items-center gap-3">

                <span class="logo-mark">
                    R<span class="orange">i</span>DE
                </span>


                <div>

                    <h1 class="font-display text-lg sm:text-xl font-semibold tracking-tight">
                        RiGiD
                    </h1>


                    <p id="liveClock" class="font-mono text-[11px] uppercase tracking-widest text-soft mt-1"></p>

                </div>

            </div>


            <!-- THEME -->

            <button id="themeToggle" class="icon-btn" type="button" title="Toggle dark mode"
                aria-label="Toggle dark mode">

                <span id="themeIcon">
                    ☾
                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-10">


        <!-- =================================================
             BRAND HERO
             ================================================= -->

        <div class="brand-hero">

            <h2 class="brand-wordmark">

                R<span class="wordmark-i">i</span>G<span class="wordmark-i">i</span>D

            </h2>


            <p class="brand-tagline">
                "And miles to go sleep before we sleep"
            </p>

        </div>



        <!-- =================================================
             RESET CARD
             ================================================= -->

        <div class="auth-card">


            <h3 class="reset-title">
                Reset your password
            </h3>



            <!-- =================================================
                 MESSAGE
                 ================================================= -->

            <div id="resetMessage" class="auth-message hidden" role="alert"></div>



            <!-- =================================================
                 UPDATE PASSWORD FORM
                 ================================================= -->

            <form id="updatePasswordForm" class="auth-form">


                <!-- NEW PASSWORD -->

                <div>

                    <label class="field-label" for="newPassword">
                        New Password
                    </label>


                    <input id="newPassword" type="password" class="field-input" minlength="8"
                        autocomplete="new-password" required>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div>

                    <label class="field-label" for="confirmPassword">
                        Confirm Password
                    </label>


                    <input id="confirmPassword" type="password" class="field-input" minlength="8"
                        autocomplete="new-password" required>


                    <p class="field-hint">
                        Use at least 8 characters.
                    </p>

                </div>



                <!-- UPDATE -->

                <button id="updatePasswordBtn" type="submit" class="btn-primary w-full justify-center">
                    Update Password
                </button>

            </form>



            <!-- =================================================
                 BACK TO LOGIN
                 ================================================= -->

            <div class="back-to-login-row">

                <a id="backToLogin" href="login.html" class="resend-link">
                    Back to Login
                </a>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="border-t border-token">

        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-center">

            <p class="font-mono text-[11px] text-soft">
                RiGiD · A Project Manager
                <span class="mx-1">|</span>
                <a href="../read-me.html">Read Me</a>
                <span class="mx-1">|</span>
                <a href="../terms.html">Terms</a>
                <span class="mx-1">|</span>
                <a href="../privacy-policy.html">Privacy</a>
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SUPABASE CLIENT
         ===================================================== -->

    <script src="../supabase-client.js"></script>

    <!-- =====================================================
         UPDATE PASSWORD LOGIC
         ===================================================== -->

    <script src="update-password.js"></script>

</body>

</html>
